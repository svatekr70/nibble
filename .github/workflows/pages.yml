# Sestaví projektový web ze site/ a nasadí ho na GitHub Pages.
# Web importuje knihovnu ze stejného repozitáře, takže build zároveň ověří, že
# se dokumentace pořád opírá o aktuální kód.
name: Pages

on:
  push:
    branches: [main]
  # Ať jde nasazení spustit i ručně, bez commitu.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Souběžná nasazení nemají smysl; poslední vyhrává. Rozdělaný běh se ale
# nepřerušuje, aby se Pages nezasekly v půlce publikace.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Na web se nesmí dostat rozbitá verze knihovny. Testy v prohlížeči jsou
      # tu podstatnější než jinde: výběr, kurzor a round-trip se mimo prohlížeč
      # ověřit nedají.
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - run: npm run site:build

      # Pojistka proti tichému rozpadu: kdyby se do webu nedostaly styly nebo
      # sestavená knihovna, nasadilo by se demo bez editoru.
      - name: Web musí nést editor i jeho styly
        run: |
          grep -q "nb-content" dist-site/dist/nibble.css
          test -s dist-site/dist/core/src/index.js
          test -s dist-site/fixtures/001.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
